name: xiangqi-backend
services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: xiangqi
      POSTGRES_USER: xiangqi
      POSTGRES_PASSWORD: xiangqi
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xiangqi -d xiangqi"]
      interval: 10s
      timeout: 5s
      retries: 5
