<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Vô Danh Kỳ Hữu — Cờ Tướng Đỉnh Cao</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Cormorant+Garamond:ital,wght@1,600;1,700&family=Dancing+Script:wght@600;700&family=LXGW+WenKai+TC:wght@700&family=Ma+Shan+Zheng&family=Merienda:wght@700;800&family=Noto+Serif+TC:wght@700;900&family=Yuji+Mai&family=Zhi+Mang+Xing&display=swap"
    rel="stylesheet">
  <script>
    // Polyfill crypto.randomUUID for non-secure contexts (HTTP on LAN IP, e.g. 192.168.x.x)
    if (typeof window !== 'undefined') {
      if (!window.crypto) {
        window.crypto = {};
      }
      if (!window.crypto.randomUUID) {
        window.crypto.randomUUID = function () {
          return '10000000-1000-4000-8000-100000000000'.replace(/[018]/g, function (c) {
            return (
              +c ^
              ((window.crypto.getRandomValues
                ? window.crypto.getRandomValues(new Uint8Array(1))[0]
                : (Math.random() * 16) | 0) &
                (15 >> (+c / 4)))
            ).toString(16);
          });
        };
      }

      // Chặn phóng to / thu nhỏ (Zoom) ngoài ý muốn trên điện thoại di động
      // 1. Chặn pinch-to-zoom (chụm/mở 2 ngón tay)
      document.addEventListener('touchstart', function (e) {
        if (e.touches && e.touches.length > 1) {
          e.preventDefault();
        }
      }, { passive: false });

      // 2. Chặn cử chỉ phóng to iOS Safari (WebKit gesture zoom)
      document.addEventListener('gesturestart', function (e) {
        e.preventDefault();
      });
      document.addEventListener('gesturechange', function (e) {
        e.preventDefault();
      });
      document.addEventListener('gestureend', function (e) {
        e.preventDefault();
      });

      // 3. Chặn double-tap to zoom (chạm 2 lần nhanh liên tiếp)
      var lastTouchEndTime = 0;
      document.addEventListener('touchend', function (e) {
        var now = Date.now();
        if (now - lastTouchEndTime <= 300) {
          var target = e.target;
          var isInput = target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.isContentEditable);
          if (!isInput) {
            e.preventDefault();
          }
        }
        lastTouchEndTime = now;
      }, { passive: false });

      // 4. Chặn Ctrl + Scroll / Pinch trên Trackpad
      document.addEventListener('wheel', function (e) {
        if (e.ctrlKey) {
          e.preventDefault();
        }
      }, { passive: false });
    }
  </script>
</head>

<body class="bg-[#0e1714] text-[#f3ead8] antialiased selection:bg-[#2a6b4e] selection:text-white overflow-x-hidden">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
